<meta charset="utf-8">

<link rel="stylesheet" href="../comum.css">
<style>
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:25;transition:opacity .25s}
.lb-topo{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(8px + env(safe-area-inset-top)) 10px 6px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;font-family:"IBM Plex Serif",Georgia,serif;pointer-events:none}
.lb-lado{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center}
.lb-lado.dir{grid-template-columns:1fr auto}.lb-lado.dir .lb-ret{order:2}.lb-lado.dir .lb-info{order:1;align-items:flex-end}
.lb-ret{width:clamp(40px,10vw,58px);height:clamp(40px,10vw,58px);border-radius:12px;border:3px solid #1B1714;background:#F7EFDF;box-shadow:3px 3px 0 #1B1714;object-fit:cover}
.lb-info{display:flex;flex-direction:column;gap:4px;min-width:0}
.lb-nome{color:#EFE4CF;font-weight:700;font-size:clamp(12px,3.2vw,17px);text-shadow:2px 2px 0 #1B1714;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lb-vida{position:relative;width:100%;height:clamp(13px,2.8vw,20px);border:3px solid #1B1714;border-radius:8px;background:#3b2a20;overflow:hidden;box-shadow:3px 3px 0 #1B1714}
.lb-vida i{position:absolute;top:0;bottom:0;left:0;transition:width .8s ease .3s;background:#ffd43b}
.lb-vida b{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(#ff6b6b,#c92a2a 60%,#9c1d1d)}
.lb-lado.dir .lb-vida i,.lb-lado.dir .lb-vida b{left:auto;right:0}
.lb-esp{position:relative;height:10px;width:75%;border:2px solid #1B1714;border-radius:5px;background:#3b2a20;overflow:hidden}
.lb-esp b{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,#E0A12F,#fff3b0)}
.lb-lado.dir .lb-esp b{left:auto;right:0}
.lb-esp.cheio{box-shadow:0 0 12px #ffd43b,0 0 2px #fff;animation:pisca .5s infinite alternate}
@keyframes pisca{to{filter:brightness(1.5)}}
.lb-pontos{display:flex;gap:5px}.lb-pontos span{width:11px;height:11px;border-radius:50%;border:2px solid #EFE4CF;background:rgba(27,23,20,.5)}.lb-pontos span.on{background:#E0A12F;border-color:#1B1714}
.lb-meio{text-align:center;color:#EFE4CF;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:auto}
.lb-tempo{font:700 clamp(28px,7vw,42px)/1 "IBM Plex Serif",serif;text-shadow:3px 3px 0 #1B1714;min-width:2ch}
.lb-round{font-size:11px;letter-spacing:.12em;font-weight:700;text-shadow:1px 1px 0 #1B1714}
.lb-mini{display:flex;gap:6px}.lb-mini button{width:34px;height:34px;border-radius:50%;border:2px solid #E0A12F;background:rgba(27,23,20,.8);color:#EFE4CF;font-size:14px;cursor:pointer;touch-action:manipulation}
.lb-hits{position:fixed;top:30%;font:700 clamp(24px,6.5vw,44px)/1 "IBM Plex Serif",serif;color:#fff;-webkit-text-stroke:2px #1B1714;text-shadow:3px 3px 0 #B9432B;z-index:21;pointer-events:none;transition:opacity .35s,transform .15s;opacity:0;white-space:nowrap}
.lb-hits small{display:block;font-size:.55em;color:#ffd43b;-webkit-text-stroke:1.5px #1B1714}
.lb-hits.e{left:12px}.lb-hits.d{right:12px;text-align:right}
#joy{position:fixed;left:calc(16px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));width:142px;height:142px;border-radius:50%;background:rgba(27,23,20,.45);border:3px solid rgba(255,241,201,.6);z-index:30;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border-radius:50%;background:rgba(224,161,47,.9);border:3px solid #1B1714;pointer-events:none}
#joy em{position:absolute;color:rgba(255,241,201,.75);font:700 13px serif;font-style:normal;pointer-events:none}
.lb-bts{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));width:236px;height:196px;z-index:30;pointer-events:none}
.lb-bts .ox-toque{position:absolute;pointer-events:auto;font-size:14px;line-height:1.05;text-align:center;border-radius:50%}
.lb-bts .ox-toque.esp{background:rgba(185,67,43,.75)}.lb-bts .ox-toque.esp.pronto{background:#E0A12F;color:#1B1714;box-shadow:0 0 16px #ffd43b}
.lb-placa{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-3deg) scale(.6);z-index:42;background:#F7EFDF;border:5px solid #1B1714;box-shadow:10px 10px 0 #1B1714;padding:16px 26px;text-align:center;font-family:"IBM Plex Serif",serif;color:#1B1714;opacity:0;transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1);pointer-events:none;max-width:86vw}
.lb-placa.on{opacity:1;transform:translate(-50%,-50%) rotate(-3deg) scale(1)}
.lb-placa h3{margin:0;font-size:clamp(34px,9vw,62px);line-height:1;color:#B9432B;letter-spacing:.02em}
.lb-placa p{margin:8px 0 0;font-style:italic;font-size:clamp(14px,3.6vw,18px)}
/* seleção */
.sel{position:fixed;inset:0;z-index:50;display:flex;align-items:stretch;justify-content:center;background:rgba(27,23,20,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));box-sizing:border-box}
.sel-cx{background:#F7EFDF;border:4px solid #1B1714;border-radius:22px;box-shadow:8px 8px 0 #1B1714;width:min(980px,100%);display:grid;grid-template-columns:minmax(0,1fr);overflow:hidden;font-family:"IBM Plex Serif",Georgia,serif;color:#1B1714}
.sel-rol{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:16px 16px 10px}
.sel h1{margin:0;font-size:clamp(24px,6vw,40px);line-height:1.05;text-align:center}.sel .sub{text-align:center;color:#B9432B;font-style:italic;margin:4px 0 10px}
.sel h2{font-size:16px;margin:14px 0 6px;display:flex;align-items:center;gap:8px}.sel h2 small{font-weight:400;opacity:.7;font-size:12px}
.sel-topo{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
#prev{width:150px;height:150px;border-radius:18px;border:3px solid #1B1714;background:radial-gradient(#fff8e7,#e9d7b0);box-shadow:4px 4px 0 #1B1714}
.sel-desc h3{margin:0;font-size:22px}.sel-desc p{margin:4px 0;font-size:14px;line-height:1.35}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.lut{border:3px solid #1B1714;border-radius:14px;background:#fff8e7;padding:4px 4px 6px;cursor:pointer;text-align:center;font:600 12px/1.15 "IBM Plex Serif",serif;color:#1B1714;touch-action:manipulation;position:relative}
.lut img{width:100%;aspect-ratio:1;border-radius:9px;display:block;background:#efe0bf}
.lut.on{background:#E0A12F;box-shadow:3px 3px 0 #1B1714}.lut.on2{background:#9ec5fe;box-shadow:3px 3px 0 #1B1714}
.lut .tag{position:absolute;top:6px;left:6px;background:#1D3656;color:#fff;font-size:9px;border-radius:6px;padding:2px 5px}
.ops{display:flex;flex-wrap:wrap;gap:8px}.ops .ox-op{flex:1 1 120px;padding:8px}
.sel-pe{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:10px;border-top:3px solid #1B1714;background:#efe2c4}
.sel-pe .ox-bt{min-height:48px}
.ajuda{font-size:12.5px;opacity:.75;text-align:center;margin:8px 0 0;line-height:1.4}
@media (max-width:520px){#prev{width:110px;height:110px}.sel-desc h3{font-size:18px}.grade{grid-template-columns:repeat(4,1fr)}.lut{font-size:10.5px}}
@media (max-width:400px){#joy{width:124px;height:124px}#joy i{width:52px;height:52px;margin:-26px}}
@media (max-height:500px){.lb-bts{transform:scale(.85);transform-origin:right bottom}#joy{transform:scale(.85);transform-origin:left bottom}}
</style>
